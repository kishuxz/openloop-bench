name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # The corpus is the deliverable, so it is checked in CI and not only by
      # whoever last edited it. `validate` proves every span still resolves;
      # `stats:check` proves the distribution has not drifted off its targets.
      - name: Validate corpus
        run: pnpm validate

      - name: Check corpus composition
        run: pnpm stats:check

      # The eval is only trustworthy if its committed artifacts are the ones its
      # code produces. Regenerate the fixtures, re-score them, re-render the
      # report, and fail on any diff: that is what makes "deterministic — same
      # inputs, same bytes out" a checked claim rather than a sentence in a
      # README. It also catches a corpus edit that silently invalidates a
      # prediction file's spans, since the hash gate refuses to score it.
      - name: Regenerate fixtures, score, and report
        run: pnpm fixtures:gen && pnpm eval && pnpm report

      - name: Results are reproducible
        run: |
          git diff --exit-code -- fixtures results
          test -z "$(git status --porcelain -- fixtures results)"
