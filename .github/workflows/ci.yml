name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # The corpus is the deliverable, so it is checked in CI and not only by
      # whoever last edited it. `validate` proves every span still resolves;
      # `stats:check` proves the distribution has not drifted off its targets.
      - name: Validate corpus
        run: pnpm validate

      - name: Check corpus composition
        run: pnpm stats:check
